# ===========================
# BT Navigator
# ===========================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    enable_groot_monitoring: true
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667


# ===========================
# Controller Server
# ===========================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["simple_goal_checker"]
    controller_plugins: ["FollowPath"]   # <- WICHTIG: Standard-Name aus Nav2-BT

    # --- Progress & Goal Checker ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    simple_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.01
      yaw_goal_tolerance: 0.1
      stateful: true

    # =========================
    #  Hauptcontroller: FollowPath (Regulated Pure Pursuit)
    # =========================
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- Max-Geschwindigkeit & Dynamik ---
      desired_linear_vel: 0.15      # moderate Speed für engen Kasten
      max_linear_accel: 0.5
      max_linear_decel: 0.5
      max_angular_vel: 1.0
      max_angular_accel: 3.0

      # --- Lookahead / Kurvenfahrt ---
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.15   # statt 0.2
      max_lookahead_dist: 0.4    # statt 0.6
      lookahead_time: 1.0        # statt 1.5


      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.25    # statt 0.4
      cost_scaling_gain: 1.0     # statt 2.0


      regulated_linear_scaling_min_radius: 0.3
      regulated_linear_scaling_min_speed: 0.05


# ===========================
# Planner Server (einfacher Grid-based Planner)
# ===========================
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1
      use_astar: false
      allow_unknown: true


# ===========================
# Smoother Server (SimpleSmoother)
# ===========================
smoother_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_tolerance: 0.1

    smoother_plugins: ["closed_area_smoother"]

    closed_area_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-8
      do_refinement: true
      refinement_num: 1         # erst mal nur 1 Refinement
      max_its: 500
      # mehr am Planner-Pfad orientieren
      w_data: 0.7        # hoch -> bleibt näher am Original
      w_smooth: 0.3      # weniger stark glätten
      enforce_path_inversion: true


# ===========================
# Global Costmap
# ===========================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 20.0
      publish_frequency: 20.0
      transform_tolerance: 0.3
      resolution: 0.01

      # Turtlebot3 Burger ~ 0.18 m Durchmesser
      robot_radius: 0.09

      # alternativ footprint statt robot_radius:
      # footprint: "[[0.18, 0.18], [0.18, -0.18], [-0.18, -0.18], [-0.18, 0.18]]"

      plugins: ["static_layer", "lane_left_layer", "lane_right_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      lane_left_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "/left_lane_map"     # Topic aus deinem lane_left-Node
        map_subscribe_transient_local: true
        subscribe_to_updates: true      # falls die Map öfter aktualisiert wird
        track_unknown_space: false
        use_maximum: true               # Kosten mit anderen Layern "maxen"
        lethal_cost_threshold: 50       # >50 => lethal/Obstacle

      lane_right_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "/right_lane_map"    # Topic aus deinem lane_right-Node
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        track_unknown_space: false
        use_maximum: true
        lethal_cost_threshold: 50

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan           # oder /scan, je nach Namensraum
          data_type: "LaserScan"
          obstacle_min_range: 0.05
          obstacle_max_range: 3.5
          raytrace_min_range: 0.05
          raytrace_max_range: 3.5
          inf_is_valid: true
          max_obstacle_height: 2.0
          clearing: true
          marking: true


      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.11      # ~40 cm Pufferzone um Hindernisse
        cost_scaling_factor: 3.0    # wie steil die Kosten abfallen


# ===========================
# Local Costmap
# ===========================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 20.0
      publish_frequency: 20.0
      transform_tolerance: 0.3
      resolution: 0.01

      width: 3
      height: 3
      rolling_window: true

      # Turtlebot3 Burger ~ 0.18 m Durchmesser
      robot_radius: 0.09

      # Zum Debuggen praktisch:
      always_send_full_costmap: true

      plugins: ["obstacle_layer", "lane_left_layer", "lane_right_layer", "inflation_layer"]

      # static_layer:
      #   plugin: "nav2_costmap_2d::StaticLayer"
      #   map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan           # oder /scan, je nach Namensraum
          data_type: "LaserScan"
          obstacle_min_range: 0.09
          obstacle_max_range: 3.5
          raytrace_min_range: 0.05
          raytrace_max_range: 3.5
          inf_is_valid: true
          max_obstacle_height: 2.0
          clearing: true
          marking: true

      lane_left_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "/left_lane_map"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        track_unknown_space: false
        use_maximum: true
        lethal_cost_threshold: 50

      lane_right_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "/right_lane_map"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        track_unknown_space: false
        use_maximum: true
        lethal_cost_threshold: 50

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.005     # etwas größer, dann fährt er nicht so nah an Wände
        cost_scaling_factor: 1.4

parcour:
  image_width_px: 640.0

  # State 1 (ALIGN) and State 3 (ALIGN_90)
  align_object_angle_deadzone_deg: 5.0

  # State 2 (DRIVE)
  drive_stop_distance_m: 0.22

  # Pause between states
  pause_duration_s: 2.0

  # Target angle for state 3 (ALIGN_90)
  align90_target_deg: 90.0

  # NEW: Step 0 (align to red)
  align_red_tolerance_px: 20.0

  # NEW: corridor in front of the robot towards the red sign
  corridor_width_m: 0.25          # total width (robot + margin)
  corridor_max_distance_m: 1.0    # how far ahead we check

  # Circle behaviour around the pillar
  circle_linear_x: 0.08           # m/s
  circle_angular_z: 0.6           # rad/s (CCW for left circle)
  circle_center_tolerance_px: 20.0
  circle_min_distance_m: 0.25     # abort circle when object is closer than this
  circle_line_freshness_s: 0.5    # s: how "fresh" x_white_near / x_yellow_near must be

  replan_interval_s: 1.0
  min_clear_distance_m: 0.3
  forward_step_distance_m: 0.3
  yaw_align_tolerance_deg: 3.0
  yaw_max_turn_deg: 90.0

  debug_logging: true
  use_lidar_for_planning: true
  use_red_for_planning: true
  align_red_tolerance_px: 20.0
  red_align_max_deg: 90.0      # maps full half-image offset to ±90°


  visualization:
    lidar_angle_min_deg: -50.0
    lidar_angle_max_deg: 54.0
    lidar_mapping_type: linear
    lidar_mapping_exp_k: 1.5
    lidar_dist_min_m: 0.2
    lidar_dist_max_m: 1.0
    lidar_dot_radius_min_px: 3
    lidar_dot_radius_max_px: 12
    y_line_offset_px: 50

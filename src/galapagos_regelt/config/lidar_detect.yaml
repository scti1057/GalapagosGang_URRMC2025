lidar:
  # Distance limits (meters)
  min_range_m: 0.12            # LDS-01 minimum range
  max_range_m: 0.7             # only consider objects up to 1m

  # Angle window to consider (degrees, in [-180, 180])
  # Example: -90 to +90 degrees = front 180° sector
  scan_angle_min_deg: -90.0
  scan_angle_max_deg: 90.0

  # Clustering: how much two neighboring points may differ (meters)
  distance_jump_threshold_m: 0.05   # 5cm

  # Minimum number of scan points to be considered a valid object
  min_cluster_points: 1

  # Tracking / smoothing
  max_objects: 3              # how many objects we publish at most
  degree_tolerance_deg: 10.0  # to match detections to existing tracks
  max_missed_iterations: 5    # how many cycles we keep an object after it disappears

bt_navigator:
  ros__parameters:
    use_bt: true
    enable_groot_monitoring: true
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667

    # Pfad zu deinem Haupt-Behavior-Tree
    # -> nach dem Installieren liegt er hier:
    #   install/tb3_nav/share/tb3_nav/behavior_trees/BT_main.xml
    default_bt_xml_filename: "/home/duckiebot1/GalapagosGang_URRMC2025/install/tb3_nav/share/tb3_nav/behavior_trees/BT_main.xml"

    # Welche BT-Node-Libraries geladen werden sollen
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node

      # hier später deine eigenen BT-Plugins ergänzen, z. B.:
      # - tb3_nav_bt_nodes

# ----------------------------
# Controller Server
# ----------------------------
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["simple_goal_checker"]
    controller_plugins: ["LaneController", "ObstacleController", "PalletController"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    simple_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.1
      stateful: True

    # -------- Mission 1: LaneController (RPP) --------
    LaneController:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      use_approach_velocity_scaling: true
      max_robot_pose_search_dist: 10.0

    # -------- Mission 2: ObstacleController (DWB) --------
    ObstacleController:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False

      min_vel_x: 0.0
      max_vel_x: 0.22
      max_vel_theta: 2.84
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      acc_lim_x: 2.5
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_theta: -3.2
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2

      critics: ["RotateToGoal", "ObstacleFootprint", "PathAlign", "PathDist", "GoalAlign", "GoalDist", "Oscillation"]

      RotateToGoal:
        plugin: "dwb_critics::RotateToGoalCritic"

      ObstacleFootprint:
        plugin: "dwb_critics::ObstacleFootprintCritic"

      PathAlign:
        plugin: "dwb_critics::PathAlignCritic"
        forward_point_distance: 0.325

      PathDist:
        plugin: "dwb_critics::PathDistCritic"

      GoalAlign:
        plugin: "dwb_critics::GoalAlignCritic"

      GoalDist:
        plugin: "dwb_critics::GoalDistCritic"

      Oscillation:
        plugin: "dwb_critics::OscillationCritic"

    # -------- Mission 4: PalletController (RPP, langsamer) --------
    PalletController:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.05
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      use_velocity_scaled_lookahead_dist: true
      use_approach_velocity_scaling: true
      transform_tolerance: 0.2


smoother_server:
  ros__parameters:
    use_sim_time: false
    # Für Kollisions-Checks beim Glätten
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_tolerance: 0.1

    # Liste der Smoother-Plugins (IDs)
    smoother_plugins: ["closed_area_smoother"]

    # Unser Smoother für Mission 3
    closed_area_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      do_refinement: true
      refinement_num: 2
      max_its: 1000
      w_data: 0.2
      w_smooth: 0.3
      enforce_path_inversion: true

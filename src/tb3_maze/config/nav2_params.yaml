# ===========================
# BT Navigator
# ===========================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    enable_groot_monitoring: true
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667


# ===========================
# Controller Server
# ===========================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["simple_goal_checker"]
    controller_plugins: ["FollowPath"]   # <- WICHTIG: Standard-Name aus Nav2-BT

    # --- Progress & Goal Checker ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    simple_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.1
      stateful: true

    # =========================
    #  Hauptcontroller: FollowPath (Regulated Pure Pursuit)
    # =========================
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- Max-Geschwindigkeit & Dynamik ---
      desired_linear_vel: 0.15      # moderate Speed für engen Kasten
      max_linear_accel: 0.5
      max_linear_decel: 0.5
      max_angular_vel: 1.0
      max_angular_accel: 3.0

      # --- Lookahead / Kurvenfahrt ---
      use_velocity_scaled_lookahead_dist: true
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.5

      # --- Geschwindigkeit drosseln nah an Hindernissen ---
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.4
      cost_scaling_gain: 2.0

      regulated_linear_scaling_min_radius: 0.3
      regulated_linear_scaling_min_speed: 0.05


# ===========================
# Planner Server (einfacher Grid-based Planner)
# ===========================
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1
      use_astar: false
      allow_unknown: true


# ===========================
# Smoother Server (SimpleSmoother)
# ===========================
smoother_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.1

    smoother_plugins: ["closed_area_smoother"]

    closed_area_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-8
      do_refinement: true
      refinement_num: 1         # erst mal nur 1 Refinement
      max_its: 500
      w_data: 0.3               # etwas näher am ursprünglichen Pfad
      w_smooth: 0.2             # moderat glätten
      enforce_path_inversion: true


# ===========================
# Global Costmap
# ===========================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 5.0
      transform_tolerance: 0.3
      resolution: 0.05

      # Turtlebot3 Burger ~ 0.18 m Radius
      robot_radius: 0.18

      # alternativ footprint statt robot_radius:
      # footprint: "[[0.18, 0.18], [0.18, -0.18], [-0.18, -0.18], [-0.18, 0.18]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40      # ~40 cm Pufferzone um Hindernisse
        cost_scaling_factor: 3.0    # wie steil die Kosten abfallen


# ===========================
# Local Costmap
# ===========================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 10.0
      transform_tolerance: 0.3
      resolution: 0.05

      width: 3.0
      height: 3.0
      rolling_window: true

      robot_radius: 0.18
      # footprint: "[[0.18, 0.18], [0.18, -0.18], [-0.18, -0.18], [-0.18, 0.18]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40
        cost_scaling_factor: 3.0

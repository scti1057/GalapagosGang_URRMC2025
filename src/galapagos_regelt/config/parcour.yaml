parcour:
  image_width_px: 640.0

  # State 1 (ALIGN) and State 3 (ALIGN_90)
  align_object_angle_deadzone_deg: 5.0      # tolerance in degrees

  # State 2 (DRIVE)
  drive_stop_distance_m: 0.22               # stop drive when object is closer than this

  # Pause between states
  pause_duration_s: 2.0                     # pause between states in seconds

  # Target angle for state 3
  align90_target_deg: 90.0                  # can tune if needed

  # Step 4: circle left around the pillar
  circle_linear_x: 0.08                     # m/s (forward speed while circling)
  circle_angular_z: 0.6                     # rad/s (positive = CCW)
  circle_center_tolerance_px: 20.0          # |x_red - center| <= this -> stop circle

  replan_interval_s: 1.0
  min_clear_distance_m: 0.3
  forward_step_distance_m: 0.3
  yaw_align_tolerance_deg: 3.0
  yaw_max_turn_deg: 90.0

  debug_logging: true
  use_lidar_for_planning: true
  use_red_for_planning: true

  visualization:
    lidar_angle_min_deg: -50.0
    lidar_angle_max_deg: 54.0
    lidar_mapping_type: linear
    lidar_mapping_exp_k: 1.5
    lidar_dist_min_m: 0.2
    lidar_dist_max_m: 1.0
    lidar_dot_radius_min_px: 3
    lidar_dot_radius_max_px: 12
    y_line_offset_px: 50
